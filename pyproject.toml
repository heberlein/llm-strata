[project]
name = "llm-strata"
version = "0.1.0"
description = "llm plugin for models served by the Strata local model runtime"
readme = "README.md"
authors = [
    { name = "heberlein", email = "heberlein@proton.me" }
]
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "llm>=0.26",
    "httpx>=0.27",
    "openai>=1.40",
    "click>=8.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/heberlein/llm-strata"
Repository = "https://github.com/heberlein/llm-strata"
Issues = "https://github.com/heberlein/llm-strata/issues"
Changelog = "https://github.com/heberlein/llm-strata/blob/master/CHANGELOG.md"

[project.entry-points.llm]
strata = "llm_strata"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "ty>=0.0.106",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
