[project]
name = "llm-strata"
version = "0.1.0"
description = "llm plugin for models served by the Strata local model runtime"
readme = "README.md"
authors = [
    { name = "heberlein", email = "heberlein@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "llm>=0.26",
    "httpx>=0.27",
    "openai>=1.40",
    "click>=8.0",
    "pydantic>=2.0",
]

[project.entry-points.llm]
strata = "llm_strata"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
