name: Release

# Tag-triggered publish to PyPI via trusted publishing (no token).
# PyPI trusted publisher must match: owner heberlein, repo llm-strata,
# workflow file "release.yml", environment "pypi".
on:
  push:
    tags: ['/^[0-9]+\.[0-9]+\.[0-9]+.*$/']

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build
      - run: uv publish --trusted-publishing always
